<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Northfield College Management System — Manage academics, attendance, examinations, fees, and college operations from one secure portal.">
  <title>Settings — Northfield CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
/* Northfield CMS — shared stylesheet (design tokens, layout, components, auth screens) */
    /* =============================================
       DESIGN TOKENS
    ============================================= */
    :root {
      --bg:        #09090b;
      --panel:     #0f0f11;
      --card:      #141416;
      --card2:     #1a1a1d;
      --line:      #222226;
      --line2:     #2a2a2e;
      --text:      #f4f4f5;
      --text2:     #a1a1aa;
      --text3:     #6b6b75;
      --primary:   #7c3aed;
      --primary-h: #6d28d9;
      --p-dim:     rgba(124,58,237,.12);
      --p-dim2:    rgba(124,58,237,.22);
      --cyan:      #22d3ee;
      --c-dim:     rgba(34,211,238,.1);
      --success:   #22c55e;
      --s-dim:     rgba(34,197,94,.12);
      --warning:   #f59e0b;
      --w-dim:     rgba(245,158,11,.12);
      --danger:    #ef4444;
      --d-dim:     rgba(239,68,68,.12);
      --radius:    12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --sidebar-w: 258px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =============================================
       SIDEBAR
    ============================================= */
    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--line);
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1040;
      display: flex;
      flex-direction: column;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 14px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .brand-mark {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: var(--primary);
      display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(124,58,237,.3);
    }
    .brand-name  { font-size: 14px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    .brand-sub   { font-size: 10px; color: var(--cyan); text-transform: uppercase; letter-spacing: .09em; margin-top: 2px; }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--line2) transparent;
    }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }

    .nav-group-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--text3);
      padding: 14px 8px 5px;
      display: block;
    }
    .nav-group-label:first-child { padding-top: 6px; }

    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: 13px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      margin-bottom: 1px;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
    }
    .nav-link:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .nav-link.active {
      background: var(--p-dim);
      color: #fff;
      border-left-color: var(--primary);
      font-weight: 600;
    }
    .nav-link.active i { color: var(--cyan); }
    .nav-link i { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .s-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #2d1b69; color: #c4b5fd;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .s-user-name { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
    .s-user-role { font-size: 10.5px; color: var(--text3); margin-top: 1px; }
    .logout-btn {
      background: none; border: none;
      color: var(--text3); font-size: 17px;
      cursor: pointer; padding: 5px;
      border-radius: 6px; display: grid; place-items: center;
      transition: color .12s;
      flex-shrink: 0;
    }
    .logout-btn:hover { color: var(--danger); }

    /* =============================================
       MAIN WRAP
    ============================================= */
    .main-wrap {
      margin-left: var(--sidebar-w);
      width: calc(100% - var(--sidebar-w));
      display: flex; flex-direction: column;
      min-height: 100vh; min-width: 0;
    }

    /* =============================================
       TOPBAR
    ============================================= */
    .topbar {
      height: 62px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky; top: 0; z-index: 1000;
      flex-shrink: 0;
      gap: 12px;
    }
    .topbar-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .mobile-toggle {
      display: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius-sm);
      width: 36px; height: 36px;
      cursor: pointer; place-items: center;
      font-size: 17px;
    }
    .page-title-text { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-breadcrumb { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .topbar-search {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 7px 12px; min-width: 200px; max-width: 260px;
    }
    .topbar-search i { color: var(--text3); font-size: 13px; flex-shrink: 0; }
    .topbar-search input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13px;
      width: 100%; font-family: inherit;
    }
    .topbar-search input::placeholder { color: var(--text3); }

    .icon-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      background: var(--card); border: 1px solid var(--line);
      color: var(--text2); cursor: pointer;
      display: grid; place-items: center;
      font-size: 16px; position: relative;
      transition: background .12s, color .12s;
    }
    .icon-btn:hover { background: var(--card2); color: var(--text); }
    .notif-dot {
      position: absolute; top: 7px; right: 7px;
      width: 7px; height: 7px;
      background: var(--danger); border-radius: 50%;
      border: 1.5px solid var(--panel);
    }

    .profile-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 5px 10px 5px 6px; cursor: pointer;
      transition: background .12s;
    }
    .profile-btn:hover { background: var(--card2); }
    .profile-btn .p-av {
      width: 26px; height: 26px; border-radius: 50%;
      background: #2d1b69; color: #c4b5fd;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    .p-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .p-role { font-size: 10px; color: var(--text3); }
    .profile-btn .bi-chevron-down { color: var(--text3); font-size: 10px; }

    /* Bootstrap dropdown overrides */
    .dropdown-menu {
      background: var(--card2) !important;
      border: 1px solid var(--line2) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 10px 36px rgba(0,0,0,.45) !important;
      padding: 6px !important; min-width: 176px !important;
    }
    .dropdown-item {
      color: var(--text2) !important;
      border-radius: var(--radius-sm) !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      display: flex !important; align-items: center !important;
      gap: 8px !important; cursor: pointer !important;
      font-family: inherit !important;
    }
    .dropdown-item:hover { background: rgba(255,255,255,.06) !important; color: var(--text) !important; }
    .dropdown-item.di-danger { color: #f87171 !important; }
    .dropdown-item.di-danger:hover { background: var(--d-dim) !important; }
    .dropdown-divider { border-color: var(--line) !important; margin: 4px 0 !important; }

    /* =============================================
       CONTENT
    ============================================= */
    .content-area {
      flex: 1; padding: 22px 24px 40px;
      max-width: 1600px; width: 100%;
    }

    /* =============================================
       CARDS & STAT CARDS
    ============================================= */
    .card-dark {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--p-dim); color: var(--cyan);
      display: grid; place-items: center;
      font-size: 19px; flex-shrink: 0;
    }
    .stat-label { font-size: 11.5px; color: var(--text2); font-weight: 500; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 5px; letter-spacing: -.02em; line-height: 1.1; }
    .stat-meta  { font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 3px; }
    .stat-up    { color: var(--success); }
    .stat-down  { color: var(--danger); }
    .stat-neutral { color: var(--text3); }
    .stat-warn  { color: var(--warning); }

    /* =============================================
       SECTION TITLES
    ============================================= */
    .section-title    { font-size: 14.5px; font-weight: 700; margin: 0; }
    .section-subtitle { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .page-header      { margin-bottom: 20px; }
    .page-header-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .page-header-sub   { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* =============================================
       TABLES
    ============================================= */
    .table-dark {
      --bs-table-bg: transparent;
      --bs-table-color: var(--text);
      --bs-table-border-color: var(--line);
      margin: 0;
    }
    .table-dark thead th {
      font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--text3);
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: rgba(255,255,255,.015);
    }
    .table-dark td {
      padding: 12px 16px; font-size: 13px;
      vertical-align: middle;
      border-color: var(--line);
    }
    .table-dark tbody tr { transition: background .1s; }
    .table-dark tbody tr:hover { background: rgba(255,255,255,.025); }
    .empty-filter-row td {
      text-align: center; padding: 38px 16px !important;
      color: var(--text3);
    }
    .empty-filter-row i { font-size: 26px; display: block; margin-bottom: 8px; }

    /* =============================================
       BADGES
    ============================================= */
    .badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      display: inline-block; white-space: nowrap;
      letter-spacing: .01em;
    }
    .badge-success { background: var(--s-dim); color: #4ade80; border: 1px solid rgba(34,197,94,.22); }
    .badge-danger  { background: var(--d-dim); color: #f87171; border: 1px solid rgba(239,68,68,.22); }
    .badge-warning { background: var(--w-dim); color: #fbbf24; border: 1px solid rgba(245,158,11,.22); }
    .badge-muted   { background: rgba(255,255,255,.06); color: var(--text2); border: 1px solid var(--line); }
    .badge-info    { background: var(--c-dim); color: var(--cyan); border: 1px solid rgba(34,211,238,.22); }
    .badge-purple  { background: var(--p-dim); color: #c4b5fd; border: 1px solid var(--p-dim2); }

    /* =============================================
       BUTTONS
    ============================================= */
    .btn {
      font-size: 13px; font-weight: 600;
      border-radius: var(--radius-sm);
      padding: 8px 14px; cursor: pointer;
      border: 1px solid transparent;
      transition: all .13s;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit;
    }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-primary-custom  { background: var(--primary);  color: #fff; border-color: var(--primary); }
    .btn-primary-custom:hover  { background: var(--primary-h); color: #fff; border-color: var(--primary-h); }
    .btn-secondary-custom { background: var(--card2); border-color: var(--line2); color: var(--text); }
    .btn-secondary-custom:hover { background: #222227; color: #fff; }
    .btn-danger-custom   { background: var(--d-dim); border-color: rgba(239,68,68,.3); color: #f87171; }
    .btn-danger-custom:hover { background: rgba(239,68,68,.22); color: #fca5a5; }
    .btn-success-custom  { background: var(--s-dim); border-color: rgba(34,197,94,.3); color: #4ade80; }
    .btn-success-custom:hover { background: rgba(34,197,94,.22); color: #86efac; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--text2); padding: 7px 10px; }
    .btn-ghost:hover { background: rgba(255,255,255,.06); color: var(--text); }

    .action-btn {
      background: none; border: none; color: var(--text3);
      padding: 5px 7px; border-radius: 6px;
      cursor: pointer; font-size: 14px;
      transition: all .12s;
    }
    .action-btn:hover { color: var(--cyan); background: var(--c-dim); }
    .action-btn.del:hover { color: #f87171; background: var(--d-dim); }

    /* =============================================
       FORMS
    ============================================= */
    .form-control, .form-select {
      background: var(--card) !important;
      border: 1px solid var(--line2) !important;
      color: var(--text) !important;
      font-size: 13px !important;
      border-radius: var(--radius-sm) !important;
      min-height: 38px; font-family: inherit !important;
    }
    .form-control::placeholder { color: var(--text3) !important; }
    .form-control:focus, .form-select:focus {
      background: var(--card2) !important;
      border-color: var(--primary) !important;
      color: var(--text) !important;
      box-shadow: 0 0 0 3px var(--p-dim) !important;
      outline: none !important;
    }
    .form-select option { background: #1a1a1d; color: var(--text); }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .form-control { padding-right: 40px; }
    .input-icon {
      position: absolute; right: 11px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; color: var(--text3);
      cursor: pointer; font-size: 15px; padding: 3px;
      transition: color .12s;
    }
    .input-icon:hover { color: var(--text); }

    /* =============================================
       PROGRESS BARS
    ============================================= */
    .progress { height: 5px; background: var(--line2); border-radius: 20px; overflow: hidden; }
    .progress-bar          { background: var(--primary); border-radius: 20px; transition: width .4s; }
    .progress-bar.bar-cyan    { background: var(--cyan); }
    .progress-bar.bar-success { background: var(--success); }
    .progress-bar.bar-warning { background: var(--warning); }
    .progress-bar.bar-danger  { background: var(--danger); }

    /* =============================================
       AUTH PAGE
    ============================================= */
    .auth-shell {
      min-height: 100vh;
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--bg);
    }

    /* Left brand panel */
    .auth-brand {
      background: linear-gradient(145deg, #110728 0%, #09090b 55%, #091620 100%);
      border-right: 1px solid var(--line);
      padding: 52px;
      display: flex; flex-direction: column; justify-content: center;
      position: relative; overflow: hidden;
    }
    .auth-brand::before {
      content: ''; position: absolute;
      width: 360px; height: 360px; border-radius: 50%;
      background: rgba(124,58,237,.09);
      top: -100px; right: -100px;
    }
    .auth-brand::after {
      content: ''; position: absolute;
      width: 260px; height: 260px; border-radius: 50%;
      background: rgba(34,211,238,.05);
      bottom: -70px; left: -50px;
    }
    .auth-brand-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .auth-brand-inner { position: relative; z-index: 1; max-width: 420px; }
    .auth-logo {
      width: 50px; height: 50px; border-radius: 13px;
      background: var(--primary);
      display: grid; place-items: center; font-size: 23px;
      margin-bottom: 26px;
      box-shadow: 0 8px 28px rgba(124,58,237,.35);
    }
    .auth-brand h1 {
      font-size: clamp(24px, 3.2vw, 34px);
      font-weight: 700; margin-bottom: 14px;
      line-height: 1.2; letter-spacing: -.02em;
    }
    .auth-brand > .auth-brand-inner > p {
      color: var(--text2); font-size: 14px;
      line-height: 1.7; margin-bottom: 30px;
    }
    .auth-feature { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
    .auth-feat-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--c-dim); color: var(--cyan);
      display: grid; place-items: center;
      font-size: 15px; flex-shrink: 0; margin-top: 2px;
    }
    .auth-feature strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .auth-feature span   { color: var(--text2); font-size: 12px; }

    /* Right form panel */
    .auth-form-wrap { display: grid; place-items: center; padding: 32px 24px; }
    .auth-card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 34px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .auth-card-logo {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--primary);
      display: grid; place-items: center; font-size: 17px;
      margin-bottom: 18px;
    }
    .auth-card h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.01em; }
    .auth-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 22px; }
    .auth-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
    .auth-options {
      display: flex; justify-content: space-between; align-items: center;
      margin: 14px 0 18px; font-size: 12px;
    }
    .auth-options label { display: flex; align-items: center; gap: 6px; color: var(--text2); cursor: pointer; }
    .auth-link { color: var(--cyan); text-decoration: none; font-weight: 600; cursor: pointer; }
    .auth-link:hover { color: #67e8f9; }
    .btn-auth { width: 100%; min-height: 42px; font-size: 14px; font-weight: 600; justify-content: center; border-radius: var(--radius-sm); }
    .auth-switch { text-align: center; margin-top: 18px; font-size: 12px; color: var(--text2); }

    /* Role selector pills */
    .role-selector { margin-bottom: 20px; }
    .role-selector-label {
      font-size: 11px; font-weight: 700;
      color: var(--text3);
      text-transform: uppercase; letter-spacing: .09em;
      display: block; margin-bottom: 8px;
    }
    .role-pills { display: flex; gap: 6px; }
    .role-pill {
      flex: 1; padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line2);
      background: var(--card2);
      color: var(--text2);
      font-size: 12px; font-weight: 600;
      cursor: pointer; text-align: center;
      font-family: inherit;
      transition: all .2s;
    }
    .role-pill:hover { border-color: var(--primary); color: var(--text); background: var(--p-dim); }
    .role-pill.active.rp-admin   { border-color: var(--primary); background: var(--p-dim); color: #c4b5fd; }
    .role-pill.active.rp-faculty { border-color: var(--cyan);    background: var(--c-dim);  color: var(--cyan); }
    .role-pill.active.rp-student { border-color: var(--success); background: var(--s-dim);  color: #4ade80; }

    /* Demo box */
    .demo-box {
      margin-top: 18px; padding: 12px 14px;
      background: rgba(34,211,238,.04);
      border: 1px solid rgba(34,211,238,.12);
      border-radius: var(--radius-sm); font-size: 11.5px;
    }
    .demo-box-title {
      color: var(--cyan); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 6px; display: block;
    }
    .demo-box-row { color: var(--text2); margin-bottom: 3px; }
    .demo-box code { color: var(--text); font-size: 11px; background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 3px; }

    /* Auth alerts */
    .auth-error {
      display: none; background: var(--d-dim);
      border: 1px solid rgba(239,68,68,.25); color: #f87171;
      padding: 10px 12px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 14px;
    }
    .auth-error.show { display: block; }
    .auth-success {
      display: none; background: var(--s-dim);
      border: 1px solid rgba(34,197,94,.25); color: #4ade80;
      padding: 10px 12px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 14px;
    }
    .auth-success.show { display: block; }

    /* =============================================
       COMPONENT: MODAL
    ============================================= */
    .modal-content { background: var(--card2) !important; color: var(--text); border: 1px solid var(--line2) !important; border-radius: var(--radius-lg) !important; }
    .modal-header  { border-color: var(--line) !important; padding: 20px 24px 16px !important; }
    .modal-footer  { border-color: var(--line) !important; padding: 16px 24px 20px !important; }
    .modal-body    { padding: 18px 24px !important; }
    .modal-title   { font-size: 16px !important; font-weight: 700 !important; }
    .btn-close     { filter: invert(1) !important; opacity: .5 !important; }
    .btn-close:hover { opacity: 1 !important; }

    /* =============================================
       COMPONENT: NOTICE / ACTIVITY
    ============================================= */
    .notice {
      border-left: 2px solid var(--cyan);
      background: var(--c-dim);
      padding: 11px 13px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 13px; color: var(--text2);
    }
    .activity { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .activity:last-child { border-bottom: none; }
    .activity p { font-size: 13px; margin: 0; }
    .activity small { color: var(--text3); font-size: 11px; }
    .act-icon {
      width: 30px; height: 30px; border-radius: 8px;
      display: grid; place-items: center;
      font-size: 13px; flex-shrink: 0;
    }

    /* =============================================
       COMPONENT: NOTIFICATIONS LIST
    ============================================= */
    .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .notif-item:last-child { border-bottom: none; }
    .notif-item-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
    .notif-item-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .notif-item-body  { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .notif-item-time  { font-size: 11px; color: var(--text3); margin-top: 5px; }
    .notif-unread { background: var(--p-dim); border-radius: var(--radius-sm); padding: 0 12px; margin: 0 -12px; }

    /* =============================================
       COMPONENT: QUICK ACTIONS
    ============================================= */
    .quick-action {
      background: var(--card2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 14px 12px;
      cursor: pointer; text-align: center;
      transition: all .13s;
    }
    .quick-action:hover { border-color: var(--primary); background: var(--p-dim); }
    .quick-action i   { font-size: 18px; color: var(--cyan); display: block; margin-bottom: 6px; }
    .quick-action span { font-size: 11px; font-weight: 500; color: var(--text2); }
    .quick-action:hover span { color: var(--text); }

    /* =============================================
       COMPONENT: COURSE TILES
    ============================================= */
    .course-tile { padding: 18px; }
    .course-code { font-size: 11px; font-weight: 700; color: var(--cyan); letter-spacing: .06em; }
    .course-tile h3 { font-size: 14px; font-weight: 700; margin: 6px 0 4px; }
    .course-tile p  { font-size: 12px; color: var(--text2); margin: 0; }

    /* =============================================
       COMPONENT: PROFILE
    ============================================= */
    .profile-avatar-lg {
      width: 72px; height: 72px; border-radius: 50%;
      background: #2d1b69; color: #c4b5fd;
      display: grid; place-items: center;
      font-size: 24px; font-weight: 700;
      margin: 0 auto 12px;
    }

    /* =============================================
       COMPONENT: SETTINGS
    ============================================= */
    .settings-section { padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .settings-section:last-child { border-bottom: none; }
    .settings-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--text3); margin-bottom: 14px; }

    /* =============================================
       COMPONENT: CHART WRAP
    ============================================= */
    .chart-wrap { position: relative; height: 220px; }

    /* =============================================
       COMPONENT: EXAM DATE CARD
    ============================================= */
    .exam-date-pill {
      min-width: 50px; text-align: center;
      background: var(--p-dim);
      border-radius: 8px; padding: 7px 10px;
      color: #c4b5fd; flex-shrink: 0;
    }
    .exam-date-pill span { display: block; font-size: 10px; font-weight: 700; }

    /* =============================================
       TOAST
    ============================================= */
    #toast {
      position: fixed; right: 18px; bottom: 18px;
      z-index: 2100;
      background: #102119;
      color: #86efac;
      border: 1px solid rgba(34,197,94,.28);
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      opacity: 0; transform: translateY(8px);
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      display: flex; align-items: center; gap: 8px;
      max-width: 300px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast i { font-size: 15px; flex-shrink: 0; }

    /* =============================================
       SIDEBAR BACKDROP (MOBILE)
    ============================================= */
    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1030; display: none; }
    .sidebar-backdrop.show { display: block; }

    /* =============================================
       FOCUS STYLES
    ============================================= */
    .btn:focus-visible, .nav-link:focus-visible,
    .action-btn:focus-visible, .role-pill:focus-visible,
    .icon-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    /* =============================================
       FORM-CHECK OVERRIDES
    ============================================= */
    .form-check-input {
      background-color: var(--card2) !important;
      border-color: var(--line2) !important;
      width: 14px; height: 14px;
    }
    .form-check-input:checked {
      background-color: var(--primary) !important;
      border-color: var(--primary) !important;
    }
    .form-check-label { font-size: 12px; color: var(--text2); cursor: pointer; }
    .form-switch .form-check-input { width: 32px; height: 18px; }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 1100px) {
      .topbar-search { display: none !important; }
    }
    @media (max-width: 768px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-brand { display: none; }
      .auth-form-wrap { padding: 24px 16px; }
      .auth-card { padding: 26px 18px; }

      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; width: 100%; }
      .mobile-toggle { display: grid; }
      .topbar { padding: 0 14px; }
      .page-breadcrumb { display: none; }
      .p-name, .p-role { display: none; }
      .profile-btn { padding: 5px; }
      .content-area { padding: 14px 14px 32px; }
    }
    @media (max-width: 480px) {
      .auth-card { padding: 22px 16px; border-radius: var(--radius); }
      .content-area { padding: 10px 12px 28px; }
      .stat-value { font-size: 21px; }
    }

    /* =============================================
       UTILITIES
    ============================================= */
    .text-cyan    { color: var(--cyan) !important; }
    .text-success-c { color: var(--success) !important; }
    .text-danger-c  { color: var(--danger) !important; }
    .text-warning-c { color: var(--warning) !important; }
    .text-muted-c   { color: var(--text2) !important; }
    .divider { border-color: var(--line) !important; margin: 14px 0 !important; }
    .stat-warn { color: var(--warning) !important; }

    /* =============================================
       QUICK ACTIONS GRID
    ============================================= */
    .qa-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(100px,1fr)); gap: 8px; }

    /* =============================================
       TIMETABLE / SCHEDULE
    ============================================= */
    .schedule-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .schedule-row:last-child { border-bottom:none; }
    .schedule-time { font-size:11px; color:var(--text3); min-width:74px; flex-shrink:0; }
    .schedule-badge { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .schedule-title { font-size:13px; font-weight:500; }
    .schedule-meta  { font-size:11px; color:var(--text3); }

    /* ============================================================
       LIQUID GLASS SKIN — overrides on top of the base stylesheet
       (Apple-style glassmorphism: translucent blurred surfaces,
       violet/coral/teal accents, ambient drifting light)
    ============================================================ */
    :root{
      --bg:        #08080b;
      --panel:     rgba(22,22,28,.55);
      --card:      rgba(255,255,255,.035);
      --card2:     rgba(255,255,255,.055);
      --line:      rgba(255,255,255,.09);
      --line2:     rgba(255,255,255,.16);
      --text:      #f3f2ef;
      --text2:     #a3a2ac;
      --text3:     #726f7c;
      --primary:   #8d7bff;
      --primary-h: #7a67f2;
      --p-dim:     rgba(141,123,255,.16);
      --p-dim2:    rgba(141,123,255,.28);
      --cyan:      #5ac8fa;
      --c-dim:     rgba(90,200,250,.14);
      --success:   #34c759;
      --s-dim:     rgba(52,199,89,.14);
      --warning:   #ff9f0a;
      --w-dim:     rgba(255,159,10,.14);
      --danger:    #ff453a;
      --d-dim:     rgba(255,69,58,.15);
      --radius:    16px;
      --radius-sm: 12px;
      --radius-lg: 24px;
      --coral:     #e8836c;
      --teal:      #3fc2b0;
      --rim-hi:    rgba(255,255,255,.35);
      --ease:      cubic-bezier(.2,.8,.2,1);
    }

    /* ---------- ambient atmosphere (no markup changes needed) ---------- */
    html{ background: var(--bg); }
    html::before, html::after{
      content:""; position:fixed; z-index:0; pointer-events:none;
      border-radius:50%; filter: blur(110px); mix-blend-mode: screen; will-change: transform;
    }
    html::before{
      width:46vw; height:46vw; top:-16vw; left:-12vw;
      background: radial-gradient(circle at 35% 35%, var(--primary), transparent 70%);
      opacity:.5; animation: lg-drift-a 34s var(--ease) infinite;
    }
    html::after{
      width:40vw; height:40vw; bottom:-16vw; right:-10vw;
      background: radial-gradient(circle at 60% 60%, var(--coral), transparent 70%);
      opacity:.32; animation: lg-drift-b 40s var(--ease) infinite;
    }
    @keyframes lg-drift-a{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(3vw,4vw) scale(1.07); } }
    @keyframes lg-drift-b{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-4vw,-3vw) scale(1.05); } }
    body{ background: transparent !important; position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce){ html::before, html::after{ animation: none; } }

    /* ---------- sidebar / topbar ---------- */
    .sidebar{
      background: rgba(18,18,24,.5) !important;
      -webkit-backdrop-filter: blur(28px) saturate(180%) contrast(1.05);
      backdrop-filter: blur(28px) saturate(180%) contrast(1.05);
      border-right: 1px solid var(--line) !important;
      box-shadow: inset -1px 0 0 rgba(255,255,255,.04), 12px 0 44px -24px rgba(0,0,0,.6);
    }
    .topbar{
      background: rgba(14,14,18,.45) !important;
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      backdrop-filter: blur(24px) saturate(170%);
      border-bottom: 1px solid var(--line) !important;
    }
    .brand-mark{
      background: conic-gradient(from 140deg, var(--primary), var(--coral), var(--teal), var(--primary)) !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 16px rgba(141,123,255,.35);
    }
    .nav-link:hover{ background: rgba(255,255,255,.06) !important; }
    .nav-link.active{ background: var(--p-dim) !important; }

    /* ---------- panels / cards / stat cards ---------- */
    .card-dark, .stat-card, .quick-action, .exam-date-pill, .notice, .demo-box{
      background: rgba(255,255,255,.035) !important;
      border: 1px solid rgba(255,255,255,.09) !important;
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      backdrop-filter: blur(22px) saturate(170%);
      box-shadow: inset 0 1px 0 var(--rim-hi), 0 24px 46px -26px rgba(0,0,0,.55);
      border-radius: var(--radius) !important;
    }
    .quick-action:hover{ border-color: rgba(141,123,255,.4) !important; background: rgba(141,123,255,.10) !important; }
    .stat-icon{ background: var(--p-dim); color: var(--primary); }
    .demo-box{ background: rgba(90,200,250,.06) !important; border-color: rgba(90,200,250,.18) !important; }

    /* ---------- modal / dropdown ---------- */
    .modal-content{
      background: rgba(20,20,26,.62) !important;
      -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.06);
      backdrop-filter: blur(36px) saturate(190%) contrast(1.06);
      border: 1px solid rgba(255,255,255,.12) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: inset 0 1px 0 var(--rim-hi), 0 30px 70px -20px rgba(0,0,0,.6);
    }
    .dropdown-menu{
      background: rgba(22,22,28,.66) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,.12) !important;
    }
    .dropdown-item:hover{ background: rgba(255,255,255,.08) !important; }

    /* ---------- buttons / inputs ---------- */
    .btn-primary-custom{
      background: linear-gradient(135deg, var(--primary), var(--primary-h)) !important;
      border-color: transparent !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 8px 20px -8px rgba(141,123,255,.55);
    }
    .btn-primary-custom:hover{ filter: brightness(1.08); }
    .btn-secondary-custom, .btn-ghost, .icon-btn, .profile-btn, .topbar-search, .mobile-toggle{
      background: rgba(255,255,255,.045) !important;
      border: 1px solid rgba(255,255,255,.10) !important;
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
    }
    .btn-secondary-custom:hover, .icon-btn:hover, .profile-btn:hover{ background: rgba(255,255,255,.08) !important; }
    .form-control, .form-select{
      background: rgba(255,255,255,.035) !important;
      border: 1px solid rgba(255,255,255,.12) !important;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .form-control:focus, .form-select:focus{
      background: rgba(255,255,255,.06) !important;
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px var(--p-dim) !important;
    }
    .form-select option{ background: #17171c !important; }

    /* ---------- tables ---------- */
    .table-dark thead th{ background: rgba(255,255,255,.03) !important; }
    .table-dark tbody tr:hover{ background: rgba(255,255,255,.04) !important; }

    /* ---------- auth screens ---------- */
    .auth-shell{ background: transparent !important; }
    .auth-brand{
      background: linear-gradient(150deg, rgba(141,123,255,.16) 0%, rgba(10,10,13,.5) 45%, rgba(63,194,176,.12) 100%) !important;
      border-right: 1px solid var(--line) !important;
    }
    .auth-brand::before{ background: rgba(141,123,255,.20) !important; }
    .auth-brand::after{ background: rgba(63,194,176,.14) !important; }
    .auth-logo, .auth-card-logo{ background: linear-gradient(135deg, var(--primary), var(--coral)) !important; }
    .auth-card{
      background: rgba(20,20,26,.5) !important;
      -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.06);
      backdrop-filter: blur(36px) saturate(190%) contrast(1.06);
      border: 1px solid rgba(255,255,255,.12) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: inset 0 1px 0 var(--rim-hi), 0 30px 70px -22px rgba(0,0,0,.6);
    }
    .role-pill{
      background: rgba(255,255,255,.04) !important;
      border: 1px solid rgba(255,255,255,.12) !important;
    }
    .role-pill.active.rp-admin{ border-color: var(--primary) !important; background: var(--p-dim) !important; color:#cdc4ff !important; }
    .role-pill.active.rp-faculty{ border-color: var(--cyan) !important; background: var(--c-dim) !important; color: var(--cyan) !important; }
    .role-pill.active.rp-student{ border-color: var(--success) !important; background: var(--s-dim) !important; color:#7be495 !important; }

    /* ---------- toast / misc ---------- */
    #toast{
      background: rgba(20,40,30,.7) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(52,199,89,.3) !important;
    }
    ::selection{ background: rgba(141,123,255,.35); }
    .btn:focus-visible, .nav-link:focus-visible, .action-btn:focus-visible,
    .role-pill:focus-visible, .icon-btn:focus-visible{ outline-color: var(--primary) !important; }

</style>
</head>

  <script>
/* ============================================================
   NORTHFIELD CMS — SHARED LOGIC (common.js)
   Loaded by every page. Holds mock data, nav config, session
   helpers, chrome (sidebar/topbar) rendering, page-content

============================================================ */

     DATA
  ============================================================ */
  const demoAccounts = [

  function getInitials(name)     { return name.split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join(''); }
/* In-memory fallback used only if the browser blocks storage
   (some browsers restrict localStorage/sessionStorage when a
   page is opened directly as a file:// URL instead of through
   a server). This keeps every button working even then. */
const memStore = { session: null, users: [] };

function getRegisteredUsers()  { try { return JSON.parse(localStorage.getItem('cms_users')||'[]'); } catch { return memStore.users; } }
function saveRegisteredUsers(l){ memStore.users = l; try { localStorage.setItem('cms_users', JSON.stringify(l)); } catch {} }
function getSession()          { try { return JSON.parse(sessionStorage.getItem('cms_session')||'null'); } catch { return memStore.session; } }
function setSession(u)         { memStore.session = u; try { sessionStorage.setItem('cms_session', JSON.stringify(u)); } catch {} }
function clearSession()        { memStore.session = null; try { sessionStorage.removeItem('cms_session'); } catch {} }

  function findAccount(email, pw) {
    const e = email.trim().toLowerCase();
    return demoAccounts.find(a => a.email===e && a.password===pw)
        || getRegisteredUsers().find(a => a.email===e && a.password===pw);
  }
  function applyUserToModule(u) {
    users[u.module] = { name: u.name, role: u.role, initials: u.initials || getInitials(u.name) };
  }


/* ============================================================
   PAGE GUARD + CHROME (sidebar / topbar)
   Every protected page calls requireAuth() first, then
   renderChrome(pageKey) to populate the sidebar (with real
   <a href> links), topbar, and page title.
============================================================ */
function requireAuth() {
  let session = getSession();
  if (!session) {
    // No login required — opening any page directly defaults to Admin.
    session = { ...demoAccounts[0] };
    setSession(session);
  }
  moduleName = session.module;
  applyUserToModule(session);
  return session;
}

function renderChrome(pageKey) {
  currentPage = pageKey;
  const u = users[moduleName];

  document.getElementById('module-brand').textContent = moduleName.charAt(0).toUpperCase()+moduleName.slice(1)+' Panel';
  document.getElementById('user-name').textContent     = u.name;
  document.getElementById('user-role').textContent     = u.role;
  document.getElementById('sidebar-avatar').textContent= u.initials;
  document.getElementById('topbar-avatar').textContent = u.initials;
  document.getElementById('topbar-name').textContent   = u.name;
  document.getElementById('topbar-role').textContent   = u.role;

  document.getElementById('side-nav').innerHTML = navDef[moduleName].map(g => `
    <span class="nav-group-label">${g.label}</span>
    ${g.items.map(x => `
      <a class="nav-link${x[0]===pageKey?' active':''}" href="${PAGE_FILE[x[0]]}" role="menuitem">
        <i class="bi bi-${x[1]}"></i>${x[2]}
      </a>`).join('')}
  `).join('');

  const meta = pageMeta[pageKey] || ['',''];
  document.getElementById('page-title').textContent =
    meta[0] || pageKey.charAt(0).toUpperCase()+pageKey.slice(1);
  document.getElementById('page-breadcrumb').textContent =
    `${moduleName.charAt(0).toUpperCase()+moduleName.slice(1)} / ${meta[0]||pageKey}`;
}

  function badge(v) {
    const lv=(v||'').toLowerCase();
    const c = /active|paid|present|completed|pass|excellent/.test(lv) ? 'success'
      : /pending|partial|upcoming|scheduled|late/.test(lv) ? 'warning'
      : /inactive|absent|due|fail/.test(lv) ? 'danger'
      : /submitted|uploaded/.test(lv) ? 'info'
      : 'muted';
    return `<span class="badge badge-${c}">${v}</span>`;
  }

  function pageHeader(page) {
    const m=pageMeta[page]||['Page',''];
    return `<div class="page-header">
      <h1 class="page-header-title">${m[0]}</h1>
      ${m[1]?`<p class="page-header-sub">${m[1]}</p>`:''}
    </div>`;
  }

  function stats(items) {
    const col = items.length<=3?'col-sm-6 col-lg-4':items.length===4?'col-sm-6 col-xl-3':'col-sm-6 col-xl-4';
    return `<div class="row g-3 mb-4">${items.map(x=>`
      <div class="${col}">
        <div class="stat-card d-flex justify-content-between align-items-start">
          <div>
            <div class="stat-label">${x[0]}</div>
            <div class="stat-value">${x[1]}</div>
            <div class="stat-meta ${x[4]||'stat-neutral'}">${x[2]||''}</div>
          </div>
          <div class="stat-icon"><i class="bi bi-${x[3]}"></i></div>
        </div>
      </div>`).join('')}</div>`;
  }

  function table(headers, data, opts={}) {
    const so = '<option value="">All Status</option><option>Active</option><option>Inactive</option><option>Pending</option><option>Paid</option><option>Partial</option><option>Upcoming</option><option>Scheduled</option><option>Pass</option><option>Fail</option>';
    const addBtn = opts.add ? `<button class="btn btn-primary-custom" onclick="openModal('${opts.add}')"><i class="bi bi-plus-lg"></i>${opts.add}</button>` : '';
    const colSpan = headers.length + (opts.actions!==false?1:0);
    return `<div class="card-dark overflow-hidden">
      <div class="p-3 d-flex flex-wrap gap-2 justify-content-between align-items-center" style="border-bottom:1px solid var(--line)">
        <div class="d-flex flex-wrap gap-2 flex-grow-1">
          <input class="form-control table-search" placeholder="Search records…" oninput="filterTable(this)" style="width:210px;max-width:100%">
          ${opts.filter?`<select class="form-select table-status-filter" style="width:145px;max-width:100%" onchange="filterTable(this)">${so}</select>`:''}
        </div>
        ${addBtn}
      </div>
      <div class="table-responsive">
        <table class="table table-dark">
          <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}${opts.actions!==false?'<th>Actions</th>':''}</tr></thead>
          <tbody>
            ${data.map(r=>`<tr>${r.map(v=>`<td>${
              typeof v==='string' && /^(Active|Inactive|Pending|Paid|Partial|Upcoming|Scheduled|Pass|Fail|Present|Absent|Late|Submitted|Not Started)$/.test(v) ? badge(v) : v
            }</td>`).join('')}${opts.actions!==false?`<td>
              <button class="action-btn" title="View"   onclick="openModal('View Details')"><i class="bi bi-eye"></i></button>
              <button class="action-btn" title="Edit"   onclick="openModal('Edit Record')"><i class="bi bi-pencil"></i></button>
              <button class="action-btn del" title="Delete" onclick="showToast('Record marked for deletion.')"><i class="bi bi-trash3"></i></button>
            </td>`:''}</tr>`).join('')}
            <tr class="empty-filter-row d-none"><td colspan="${colSpan}"><i class="bi bi-search"></i>No matching records found.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="px-4 py-2" style="border-top:1px solid var(--line)">
        <small style="color:var(--text3)">Showing <span class="visible-count">${data.length}</span> of ${data.length} records</small>
      </div>
    </div>`;
  }

  /* ============================================================
     FILTER
  ============================================================ */
  function filterTable(el) {
    const card=el.closest('.card-dark'); if(!card) return;
    const q=(card.querySelector('.table-search')?.value||'').toLowerCase().trim();
    const status=(card.querySelector('.table-status-filter')?.value||'').toLowerCase().trim();
    const trs=card.querySelectorAll('tbody tr:not(.empty-filter-row)');
    let visible=0;
    trs.forEach(tr=>{
      const text=tr.innerText.toLowerCase();
      const show=(!q||text.includes(q))&&(!status||text.includes(status));
      tr.style.display=show?'':'none';
      if(show) visible++;
    });
    const emptyRow=card.querySelector('.empty-filter-row');
    const countEl=card.querySelector('.visible-count');
    if(emptyRow) emptyRow.classList.toggle('d-none', visible>0);
    if(countEl)  countEl.textContent=visible;
  }
